version: '3.8'

services:
  hookarmor:
    image: ghcr.io/pkdoddamani/hookarmor:latest
    build: .
    container_name: hookarmor
    restart: unless-stopped
    ports:
      - "4000:4000"
    volumes:
      - hookarmor_data:/app/data
    environment:
      - PORT=4000
      - NODE_ENV=production
      - HOOKARMOR_API_KEY=${HOOKARMOR_API_KEY:?HOOKARMOR_API_KEY environment variable is required}

volumes:
  hookarmor_data:
